<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · Mitchell</title>
<script>
/* El panel es una sola aplicacion: GitHub Pages no tiene un archivo por cada
   ruta interna, asi que cae aqui. Guardamos la ruta y rebotamos al panel,
   que la restaura antes de arrancar. Para el resto del sitio, 404 normal. */
(function(){
  var p = location.pathname;
  if (p.indexOf('/admin') === 0) {
    try { sessionStorage.setItem('mitchell_ruta', p + location.search + location.hash); } catch(e){}
    location.replace('/admin/');
  }
})();
</script>
<link rel="stylesheet" href="/css/site.css">
<link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png">
<meta name="robots" content="noindex">
</head>
<body>
<main class="wrap" style="min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1.2rem;padding-block:5rem">
  <img src="/marca/logo.png" srcset="/marca/logo.png 197w, /marca/logo@2x.png 394w" sizes="197px" width="197" height="44" alt="Marquillas y clisés Mitchell">
  <h1 style="max-width:16ch">Esta página no existe</h1>
  <p class="lead" style="max-width:40ch">Puede que el enlace esté viejo o tenga un error de escritura. Abajo están las dos rutas que sirven.</p>
  <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center">
    <a class="btn btn-white" href="/">Ir al inicio</a>
    <a class="btn btn-line" href="/#catalogo">Ver qué fabricamos</a>
  </div>
</main>
</body></html>
